[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "error-webhook-dispatcher"
version = "1.0.0"
description = "A bounded-retry Python logging handler for Discord webhooks"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Ronak Soltani"}]
dependencies = ["requests>=2.31", "python-dotenv>=1.0"]

[project.scripts]
error-webhook-demo = "error_webhook.demo:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "responses>=0.25"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
